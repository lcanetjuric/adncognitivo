name: Publicar copia en la TAC

# Compila el sitio con /adncognitivo/ y publica el resultado en la rama deploy
# de este mismo repo. La raíz de esa rama es el sitio (index.html), sin
# var/www/html. Ferozo tiene que clonar esa rama en una carpeta vacía
# public_html/adncognitivo, no en public_html entero.
#
# Cada push reemplaza la rama deploy. No toca main ni master de ConicetTAC.
# Netlify sigue siendo donde se edita. Ver DEPLOY-TAC.md.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout adncognitivo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar con el prefijo de la TAC
        run: npx eleventy --pathprefix=/adncognitivo/

      - name: Excluir el panel del CMS de la copia pública
        run: rm -rf _site/admin

      - name: Publicar la rama deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _site
          git init -b deploy
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Sitio compilado para tac.com.ar/adncognitivo (${{ github.sha }})"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:deploy
