# ==========================================================
#  Decap CMS · ADNCognitivo
#  Archivo generado por scripts/cms/generar_config.py
#  IMPORTANTE: reemplazar USUARIO-DE-GITHUB por tu usuario
#  (ver README, paso "Conectar el administrador").
# ==========================================================
backend:
  name: github
  repo: lcanetjuric/adncognitivo
  branch: main
  base_url: https://api.netlify.com
  commit_messages:
    create: Crear {{collection}} “{{slug}}”
    update: Actualizar {{collection}} “{{slug}}”
    delete: Eliminar {{collection}} “{{slug}}”
    uploadMedia: Subir archivo “{{path}}”
    deleteMedia: Eliminar archivo “{{path}}”
local_backend: true
locale: es
logo_url: /assets/img/marca/logo-horizontal.svg
media_folder: src/assets/uploads
public_folder: /assets/uploads
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'
collections:
- name: cursos
  label: Cursos
  label_singular: Curso
  folder: content/productos/cursos
  create: true
  extension: md
  format: frontmatter
  slug: '{{slug}}'
  identifier_field: titulo
  summary: '{{titulo}} · {{estado}}'
  editor:
    preview: false
  sortable_fields:
  - titulo
  - orden
  - estado
  fields:
  - label: Título
    name: titulo
    widget: string
  - label: Slug (dirección web)
    name: slug
    widget: string
    required: false
    hint: 'Opcional. Final de la URL, sin espacios ni acentos (ej: cufe-2). Si queda vacío se genera desde el título.'
  - label: Tipo
    name: tipo
    widget: hidden
    default: curso
  - label: Categoría
    name: categoria
    widget: select
    options:
    - Curso
    required: false
  - label: Descripción breve
    name: descripcion
    widget: text
    hint: Una a tres líneas. Aparece en los listados.
  - label: Temas
    name: tema
    widget: select
    multiple: true
    options: &id001
    - Cognición
    - Desarrollo
    - Aprendizaje
    - Funciones ejecutivas
    - Memoria
    - Metacognición
    - Evaluación
    required: false
  - label: Público
    name: publico
    widget: select
    multiple: true
    options: &id002
    - Salud
    - Educación
    - Investigación
    - Profesionales
    required: false
    hint: Podés elegir varios. Si no aplica a un público en particular, dejalo vacío.
  - &id003
    label: Modalidad
    name: modalidad
    widget: string
    required: false
    hint: 'Ej: en línea, asincrónica, presencial.'
  - &id004
    label: Duración
    name: duracion
    widget: string
    required: false
  - &id005
    label: Fechas / inicio
    name: fechas
    widget: string
    required: false
  - label: Imagen
    name: imagen
    widget: image
    required: false
    hint: Opcional. Si no hay imagen se muestra una portada tipográfica automática.
  - label: Descripción de la imagen (texto alternativo)
    name: imagen_alt
    widget: string
    required: false
    hint: Qué se ve en la imagen, para personas que usan lectores de pantalla.
  - label: ¿Es gratuito?
    name: gratuito
    widget: boolean
    default: false
    required: false
    hint: Gratuito → botón ACCEDER / DESCARGAR / EXPLORAR. Pago → botón COMPRAR.
  - label: Precio
    name: precio
    widget: string
    required: false
    hint: 'Solo el número (ej: 45 o 25000). Vacío = no se muestra precio.'
  - label: Moneda
    name: moneda
    widget: select
    options: &id006
    - USD
    - ARS
    - EUR
    required: false
  - label: URL de compra (Payhip u otra plataforma)
    name: url_compra
    widget: string
    required: false
    hint: Pegá el enlace de checkout del producto. El botón COMPRAR lleva a esta dirección.
  - label: URL de acceso (gratuitos)
    name: url_acceso
    widget: string
    required: false
    hint: 'Para productos gratuitos: enlace a la página, video, formulario o archivo externo.'
  - label: Archivo descargable (gratuitos)
    name: archivo
    widget: file
    required: false
    hint: Si subís un archivo (PDF, etc.) el botón pasa a ser DESCARGAR.
  - label: Texto del botón (opcional)
    name: texto_boton
    widget: string
    required: false
    hint: Solo si querés reemplazar el texto automático (Comprar / Acceder / Descargar / Explorar).
  - label: Estado
    name: estado
    widget: select
    options: &id007
    - label: Disponible
      value: disponible
    - label: Próximamente
      value: proximamente
    - label: Finalizado / no disponible
      value: finalizado
    default: disponible
  - label: Destacado
    name: destacado
    widget: boolean
    default: false
    required: false
    hint: Los destacados aparecen en la página de inicio.
  - label: Mostrar también en Recursos gratuitos
    name: tambien_en_recursos
    widget: boolean
    default: false
    required: false
    hint: Solo tiene efecto si el producto es gratuito.
  - label: Orden
    name: orden
    widget: number
    default: 10
    value_type: int
    required: false
    hint: Número menor = aparece primero.
  - label: Visible en la web
    name: visible
    widget: boolean
    default: true
    required: false
    hint: Desactivalo para ocultar sin borrar.
  - label: Descripción larga
    name: body
    widget: markdown
    required: false
