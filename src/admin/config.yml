    name: integrantes
    widget: relation
    collection: equipo
    search_fields:
    - nombre
    value_field: '{{slug}}'
    display_fields:
    - nombre
    multiple: true
    required: false
    hint: Vincula la publicación con la ficha del integrante (aparece en su página).
  - label: Imagen (tapa, figura)
    name: imagen
    widget: image
    required: false
  - label: Descripción de la imagen
    name: imagen_alt
    widget: string
    required: false
  - label: DOI
    name: doi
    widget: string
    required: false
    hint: 'Ej: 10.1016/j.xxxx.2024.01.001 (sin https://doi.org/).'
  - label: Enlace
    name: enlace
    widget: string
    required: false
    hint: URL a la publicación, repositorio o editorial. Si está vacío se usa el DOI.
  - label: Archivo PDF (si la licencia lo permite)
    name: pdf
    widget: file
    required: false
  - label: Destacada
    name: destacado
    widget: boolean
    default: false
    required: false
  - label: Orden (dentro del mismo año)
    name: orden
    widget: number
    default: 10
    value_type: int
    required: false
  - label: Visible en la web
    name: visible
    widget: boolean
    default: true
    required: false
  - label: Texto adicional
    name: body
    widget: markdown
    required: false
