      label: Autor/a
      name: autor
      widget: string
  - label: Año
    name: anio
    widget: number
    value_type: int
    required: false
  - &id008
    label: Editorial
    name: editorial
    widget: string
    required: false
  - label: ISBN
    name: isbn
    widget: string
    required: false
  - label: Rol (autoría, compilación…)
    name: rol
    widget: string
    required: false
  - label: Descripción / resumen breve
    name: descripcion
    widget: text
    required: false
